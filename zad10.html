<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menedżer Zadań</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f2f2f2;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 15px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            transition: 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #007BFF;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .alert {
            grid-column: 1 / -1;
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #f5c6cb;
            padding: 10px 15px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .alert span {
            margin-left: 8px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .checkbox-group label {
            font-weight: normal;
        }

        button {
            padding: 10px 20px;
            background: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            grid-column: 1 / -1;
            justify-self: start;
        }

        button:hover {
            background: #0056b3;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }

        @media(max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Dodaj nowe zadanie</h1>
    </header>

    <main>
        <form>
            <div class="alert">
                ⚠ <span>Kategoria jest wymagana</span>
            </div>

            <div>
                <label for="tytul">Tytuł zadania: *</label>
                <input type="text" id="tytul" name="tytul" required>
            </div>

            <div>
                <label for="kategoria">Kategoria: *</label>
                <select id="kategoria" name="kategoria" required>
                    <option value="">Wybierz kategorię</option>
                    <option value="domowe">Domowe</option>
                    <option value="praca">Praca</option>
                    <option value="nauka">Nauka</option>
                    <option value="hobby">Hobby</option>
                    <option value="inne">Inne</option>
                </select>
            </div>

            <div class="full-width">
                <label for="opis">Opis zadania:</label>
                <textarea id="opis" name="opis"></textarea>
            </div>

            <div>
                <label for="priorytet">Priorytet: *</label>
                <select id="priorytet" name="priorytet" required>
                    <option value="">Wybierz priorytet</option>
                    <option value="niski">Niski</option>
                    <option value="sredni">Średni</option>
                    <option value="wysoki">Wysoki</option>
                </select>
            </div>

            <div>
                <label for="status">Status:</label>
                <select id="status" name="status">
                    <option value="">Wybierz status</option>
                    <option value="nowe">Nowe</option>
                    <option value="w_toku">W toku</option>
                    <option value="zrobione">Zrobione</option>
                </select>
            </div>

            <div>
                <label for="data_wykonania">Data wykonania: *</label>
                <input type="date" id="data_wykonania" name="data_wykonania" required>
            </div>

            <div>
                <label for="czas">Szacowany czas (minuty):</label>
                <input type="number" id="czas" name="czas" min="0" step="1">
            </div>

            <div>
                <label for="lokalizacja">Lokalizacja:</label>
                <input type="text" id="lokalizacja" name="lokalizacja">
            </div>

            <div>
                <label for="osoba">Osoba przypisana:</label>
                <input type="text" id="osoba" name="osoba">
            </div>

            <div class="full-width">
                <label>Potrzebne zasoby:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="zasoby[]" value="komputer"> Komputer</label>
                    <label><input type="checkbox" name="zasoby[]" value="internet"> Internet</label>
                    <label><input type="checkbox" name="zasoby[]" value="telefon"> Telefon</label>
                    <label><input type="checkbox" name="zasoby[]" value="samochod"> Samochód</label>
                    <label><input type="checkbox" name="zasoby[]" value="ksiazka"> Książka</label>
                    <label><input type="checkbox" name="zasoby[]" value="narzedzia"> Narzędzia</label>
                    <label><input type="checkbox" name="zasoby[]" value="dokumenty"> Dokumenty</label>
                    <label><input type="checkbox" name="zasoby[]" value="inne"> Inne</label>
                </div>
            </div>

            <div class="full-width">
                <button type="submit">Dodaj zadanie</button>
            </div>
        </form>
    </main>

    <footer>
        &copy; 2026 Menager Zadan
    </footer>

</body>

</html>
